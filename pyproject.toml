[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalpost"
version = "0.1.0"
description = "Evidence-backed company intelligence agent for Norwegian organisation numbers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signalpost = "signalpost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
